<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kokakola · Premium Card System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        /* ===== ТЕМЫ ===== */
        :root {
            --bg-gradient-start: #667eea;
            --bg-gradient-end: #764ba2;
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.2);
            --card-bg: rgba(255, 255, 255, 0.95);
            --card-border: rgba(255, 255, 255, 0.3);
            --card-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --text-white: #ffffff;
            --input-bg: #ffffff;
            --input-border: #e5e7eb;
            --section-bg: #f8fafc;
            --section-bg-green: #f0fdf4;
            --section-bg-purple: #faf5ff;
            --section-bg-yellow: #fffbeb;
            --section-bg-cyan: #ecfeff;
            --transaction-bg: #f9fafb;
            --transaction-hover: #f3f4f6;
            --border-color: #f3f4f6;
            --scrollbar-track: rgba(255, 255, 255, 0.1);
            --scrollbar-thumb: rgba(102, 126, 234, 0.5);
            --scrollbar-thumb-hover: rgba(102, 126, 234, 0.8);
        }

        [data-theme="dark"] {
            --bg-gradient-start: #0f0c29;
            --bg-gradient-end: #302b63;
            --glass-bg: rgba(0, 0, 0, 0.4);
            --glass-border: rgba(255, 255, 255, 0.1);
            --card-bg: rgba(30, 30, 50, 0.95);
            --card-border: rgba(255, 255, 255, 0.05);
            --card-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            --text-primary: #e5e7eb;
            --text-secondary: #9ca3af;
            --text-white: #ffffff;
            --input-bg: #1a1a2e;
            --input-border: #374151;
            --section-bg: #1a1a2e;
            --section-bg-green: #0f2a1a;
            --section-bg-purple: #1a1030;
            --section-bg-yellow: #2a1f0a;
            --section-bg-cyan: #0a1f2a;
            --transaction-bg: #1a1a2e;
            --transaction-hover: #2a2a3e;
            --border-color: #374151;
            --scrollbar-track: rgba(255, 255, 255, 0.05);
            --scrollbar-thumb: rgba(102, 126, 234, 0.3);
            --scrollbar-thumb-hover: rgba(102, 126, 234, 0.6);
        }

        body {
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #app {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 40px;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 24px;
            box-shadow: var(--card-shadow);
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.2);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: var(--glass-bg);
            color: var(--text-white);
            border: 1px solid var(--glass-border);
            padding: 12px 24px;
            border-radius: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .btn-theme {
            background: var(--glass-bg);
            color: var(--text-white);
            border: 1px solid var(--glass-border);
            padding: 10px 20px;
            border-radius: 14px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-theme:hover {
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.25);
        }

        .input-modern {
            border: 2px solid var(--input-border);
            padding: 10px 16px;
            border-radius: 12px;
            width: 100%;
            font-size: 14px;
            transition: all 0.3s ease;
            background: var(--input-bg);
            color: var(--text-primary);
        }

        .input-modern:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .input-modern::placeholder {
            color: var(--text-secondary);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }

        .status-dot.active {
            background: #10b981;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }

        .status-dot.pending {
            background: #f59e0b;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
        }

        .status-dot.blocked {
            background: #ef4444;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
        }

        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .slide-up {
            animation: slideUp 0.5s ease-out;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--scrollbar-thumb-hover);
        }

        @media (max-width: 768px) {
            .glass {
                padding: 20px;
            }
            .glass-card {
                padding: 16px;
            }
            .grid-cards {
                grid-template-columns: 1fr;
            }
        }

        .card-number {
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .login-container {
            max-width: 420px;
            margin: 0 auto;
        }

        .transaction-item {
            background: var(--transaction-bg);
            padding: 10px 16px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            transition: all 0.2s ease;
            color: var(--text-primary);
        }

        .transaction-item:hover {
            background: var(--transaction-hover);
            transform: translateX(5px);
        }

        .payment-code {
            background: var(--transaction-bg);
            padding: 8px 16px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 4px;
            text-align: center;
            margin: 8px 0;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-primary);
        }

        .payment-code:hover {
            background: var(--transaction-hover);
            transform: scale(1.02);
        }

        .payment-code.copied {
            background: #10b981;
            color: white;
        }

        .theme-toggle-container {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .login-title {
            color: var(--text-white);
        }

        .login-title h1 {
            color: var(--text-white);
        }

        .login-title p {
            color: rgba(255, 255, 255, 0.8);
        }

        [data-theme="dark"] .glass-card h2,
        [data-theme="dark"] .glass-card h3,
        [data-theme="dark"] .glass-card p,
        [data-theme="dark"] .glass-card span,
        [data-theme="dark"] .glass-card div:not(.status-dot) {
            color: var(--text-primary);
        }

        [data-theme="dark"] .glass-card .status-dot {
            color: initial;
        }

        [data-theme="dark"] .glass-card .transaction-item span {
            color: var(--text-primary);
        }

        [data-theme="dark"] #cardList .card-number {
            color: var(--text-primary);
        }

        [data-theme="dark"] .grid-cards > div[style*="background: #f8fafc"] {
            background: #1a1a2e !important;
        }

        [data-theme="dark"] .grid-cards > div[style*="background: #f0fdf4"] {
            background: #0f2a1a !important;
        }

        [data-theme="dark"] .grid-cards > div[style*="background: #faf5ff"] {
            background: #1a1030 !important;
        }

        [data-theme="dark"] .grid-cards > div[style*="background: #fffbeb"] {
            background: #2a1f0a !important;
        }

        [data-theme="dark"] .grid-cards > div[style*="background: #ecfeff"] {
            background: #0a1f2a !important;
        }

        [data-theme="dark"] .grid-cards > div[style*="background: linear-gradient(135deg, #fef3c7, #fde68a)"] {
            background: linear-gradient(135deg, #2a1f0a, #3a2f1a) !important;
        }

        [data-theme="dark"] .grid-cards > div[style*="background: linear-gradient(135deg, #fecaca, #fca5a5)"] {
            background: linear-gradient(135deg, #2a0a0a, #3a1a1a) !important;
        }

        [data-theme="dark"] .grid-cards > div[style*="background: linear-gradient(135deg, #ddd6fe, #c4b5fd)"] {
            background: linear-gradient(135deg, #1a1030, #2a1a40) !important;
        }

        [data-theme="dark"] .grid-cards > div[style*="background: linear-gradient(135deg, #dbeafe, #bfdbfe)"] {
            background: linear-gradient(135deg, #0a1a2a, #1a2a3a) !important;
        }

        [data-theme="dark"] .grid-cards > div[style*="background: linear-gradient(135deg, #d1fae5, #a7f3d0)"] {
            background: linear-gradient(135deg, #0a2a1a, #1a3a2a) !important;
        }

        [data-theme="dark"] .grid-cards > div[style*="background: linear-gradient(135deg, #ede9fe, #c4b5fd)"] {
            background: linear-gradient(135deg, #1a1030, #2a1a40) !important;
        }

        [data-theme="dark"] .grid-cards > div[style*="background: linear-gradient(135deg, #fef3c7, #fde68a)"] p,
        [data-theme="dark"] .grid-cards > div[style*="background: linear-gradient(135deg, #fecaca, #fca5a5)"] p,
        [data-theme="dark"] .grid-cards > div[style*="background: linear-gradient(135deg, #ddd6fe, #c4b5fd)"] p,
        [data-theme="dark"] .grid-cards > div[style*="background: linear-gradient(135deg, #dbeafe, #bfdbfe)"] p,
        [data-theme="dark"] .grid-cards > div[style*="background: linear-gradient(135deg, #d1fae5, #a7f3d0)"] p,
        [data-theme="dark"] .grid-cards > div[style*="background: linear-gradient(135deg, #ede9fe, #c4b5fd)"] p {
            color: var(--text-primary) !important;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--card-bg);
            color: var(--text-primary);
            padding: 16px 32px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            border: 1px solid var(--border-color);
            font-weight: 600;
            z-index: 999;
            animation: slideUp 0.3s ease-out;
            max-width: 90%;
            text-align: center;
        }

        .toast.success {
            border-left: 4px solid #10b981;
        }

        .toast.error {
            border-left: 4px solid #ef4444;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        // ============================================
        // УПРАВЛЕНИЕ ТЕМОЙ
        // ============================================
        function getTheme() {
            return localStorage.getItem('kokakola_theme') || 'light';
        }

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('kokakola_theme', theme);
            const themeBtn = document.getElementById('themeToggleBtn');
            if (themeBtn) {
                themeBtn.textContent = theme === 'dark' ? '☀️ Светлая' : '🌙 Тёмная';
            }
        }

        function toggleTheme() {
            const current = getTheme();
            const next = current === 'dark' ? 'light' : 'dark';
            setTheme(next);
        }

        setTheme(getTheme());

        // ============================================
        // TOAST УВЕДОМЛЕНИЯ
        // ============================================
        function showToast(message, type = 'success') {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(-50%) translateY(20px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // ============================================
        // DB - База данных
        // ============================================
        class DB {
            constructor() {
                const saved = localStorage.getItem('kokakola_db');
                if (saved) {
                    this.data = JSON.parse(saved);
                } else {
                    this.data = this.getDefaults();
                }
                this.cards = this.data.cards || [];
                this.businesses = this.data.businesses || [];
                this.transactions = this.data.transactions || [];
                this.credits = this.data.credits || [];
                this.paymentCodes = this.data.paymentCodes || [];
                this.lastPaymentCode = this.data.lastPaymentCode || null;
                this.currentUser = this.data.currentUser || null;
                this.currentBusiness = this.data.currentBusiness || null;
                this.isAdmin = this.data.isAdmin || false;
            }

            getDefaults() {
                return {
                    cards: [{
                        number: 'KOKA-1111-2222',
                        balance: 1000,
                        blocked: false,
                        status: 'active',
                        owner: 'Алексей',
                        transactions: [],
                        lastTaxDate: '',
                        creditLimit: 5000,
                        creditUsed: 0,
                        creditRating: 4.5,
                        createdAt: new Date().toISOString()
                    }, {
                        number: 'KOKA-3333-4444',
                        balance: 500,
                        blocked: false,
                        status: 'active',
                        owner: 'Мария',
                        transactions: [],
                        lastTaxDate: '',
                        creditLimit: 3000,
                        creditUsed: 0,
                        creditRating: 3.8,
                        createdAt: new Date().toISOString()
                    }],
                    businesses: [{
                        id: 'b1',
                        login: 'shop1',
                        password: 'pass1',
                        name: 'Магазин у дома',
                        todayEarn: 0,
                        blockedCards: [],
                        fines: [],
                        rating: 5,
                        transactions: []
                    }],
                    transactions: [],
                    credits: [],
                    paymentCodes: [],
                    lastPaymentCode: null,
                    currentUser: null,
                    currentBusiness: null,
                    isAdmin: false
                };
            }

            save() {
                this.data.cards = this.cards;
                this.data.businesses = this.businesses;
                this.data.transactions = this.transactions;
                this.data.credits = this.credits;
                this.data.paymentCodes = this.paymentCodes;
                this.data.lastPaymentCode = this.lastPaymentCode;
                this.data.currentUser = this.currentUser;
                this.data.currentBusiness = this.currentBusiness;
                this.data.isAdmin = this.isAdmin;
                localStorage.setItem('kokakola_db', JSON.stringify(this.data));
            }

            findCard(number) {
                return this.cards.find(c => c.number === number);
            }

            addCard(number, owner) {
                if (this.findCard(number)) return false;
                const card = {
                    number,
                    owner,
                    balance: 0,
                    blocked: false,
                    status: 'pending',
                    creditLimit: 0,
                    creditUsed: 0,
                    creditRating: 0,
                    transactions: [],
                    lastTaxDate: '',
                    createdAt: new Date().toISOString()
                };
                this.cards.push(card);
                this.save();
                showToast(`✅ Карта ${number} создана для ${owner}! Ожидает одобрения админа.`, 'success');
                return true;
            }

            blockCard(number) {
                const card = this.findCard(number);
                if (card) {
                    card.blocked = !card.blocked;
                    card.status = card.blocked ? 'blocked' : 'active';
                    this.save();
                    showToast(`🔄 Статус карты ${number}: ${card.status}`, card.status === 'active' ? 'success' : 'error');
                    return true;
                }
                showToast('❌ Карта не найдена', 'error');
                return false;
            }

            approveCard(number) {
                const card = this.findCard(number);
                if (card && card.status === 'pending') {
                    card.status = 'active';
                    card.blocked = false;
                    card.creditLimit = 1000;
                    this.save();
                    showToast(`✅ Карта ${number} одобрена! Кредитный лимит: 1000₽`, 'success');
                    return true;
                } else if (card && card.status === 'active') {
                    showToast(`⚠️ Карта ${number} уже активна`, 'error');
                    return false;
                } else {
                    showToast('❌ Карта не найдена', 'error');
                    return false;
                }
            }

            addBalance(number, amount) {
                const card = this.findCard(number);
                if (card && card.status === 'active') {
                    card.balance += amount;
                    this.save();
                    showToast(`💰 Баланс карты ${number}: +${amount}₽ (теперь ${card.balance}₽)`, 'success');
                    return true;
                }
                showToast('❌ Карта не найдена или не активна', 'error');
                return false;
            }

            deductBalance(number, amount) {
                const card = this.findCard(number);
                if (card && card.status === 'active' && card.balance >= amount) {
                    card.balance -= amount;
                    this.save();
                    showToast(`💰 Баланс карты ${number}: -${amount}₽ (теперь ${card.balance}₽)`, 'success');
                    return true;
                }
                showToast('❌ Недостаточно средств или карта не активна', 'error');
                return false;
            }

            addBusiness(login, password, name) {
                if (this.businesses.find(b => b.login === login)) {
                    showToast('❌ Логин занят', 'error');
                    return false;
                }
                const biz = {
                    id: 'b' + Date.now(),
                    login,
                    password,
                    name,
                    todayEarn: 0,
                    blockedCards: [],
                    fines: [],
                    rating: 5,
                    transactions: []
                };
                this.businesses.push(biz);
                this.save();
                showToast(`✅ Бизнес "${name}" создан! Логин: ${login}`, 'success');
                return true;
            }

            giveCredit(cardNumber, amount) {
                const card = this.findCard(cardNumber);
                if (!card || card.status !== 'active') {
                    showToast('❌ Карта не активна', 'error');
                    return { success: false, msg: 'Карта не активна' };
                }
                const newTotal = (card.creditUsed || 0) + amount;
                if (newTotal > (card.creditLimit || 0)) {
                    showToast('❌ Превышен кредитный лимит', 'error');
                    return { success: false, msg: 'Превышен кредитный лимит' };
                }

                card.creditUsed = newTotal;
                card.balance += amount;
                card.transactions.push({
                    amount: amount,
                    desc: `Кредит ${amount}₽`,
                    date: new Date().toISOString()
                });

                this.credits.push({
                    cardNumber,
                    amount,
                    date: new Date().toISOString(),
                    repaid: false
                });

                this.save();
                showToast(`✅ Кредит ${amount}₽ выдан на карту ${cardNumber}`, 'success');
                return { success: true, msg: `Кредит ${amount}₽ выдан` };
            }

            repayCredit(cardNumber, amount) {
                const card = this.findCard(cardNumber);
                if (!card) {
                    showToast('❌ Карта не найдена', 'error');
                    return { success: false, msg: 'Карта не найдена' };
                }
                if (card.balance < amount) {
                    showToast('❌ Недостаточно средств', 'error');
                    return { success: false, msg: 'Недостаточно средств' };
                }
                if ((card.creditUsed || 0) < amount) {
                    showToast('❌ Сумма превышает долг', 'error');
                    return { success: false, msg: 'Сумма превышает долг' };
                }

                card.creditUsed -= amount;
                card.balance -= amount;
                card.transactions.push({
                    amount: -amount,
                    desc: `Погашение кредита ${amount}₽`,
                    date: new Date().toISOString()
                });

                const credits = this.credits.filter(c => c.cardNumber === cardNumber && !c.repaid);
                let remaining = amount;
                for (const credit of credits) {
                    if (remaining <= 0) break;
                    if (credit.amount <= remaining) {
                        credit.repaid = true;
                        remaining -= credit.amount;
                    } else {
                        credit.amount -= remaining;
                        remaining = 0;
                    }
                }

                this.updateCreditRating(cardNumber);
                this.save();
                showToast(`✅ Кредит погашен на ${amount}₽`, 'success');
                return { success: true, msg: `Кредит погашен на ${amount}₽` };
            }

            updateCreditRating(cardNumber) {
                const card = this.findCard(cardNumber);
                if (!card) return;
                const totalCredits = this.credits.filter(c => c.cardNumber === cardNumber);
                if (totalCredits.length === 0) {
                    card.creditRating = 0;
                } else {
                    const repaid = totalCredits.filter(c => c.repaid).length;
                    card.creditRating = Math.min(5, (repaid / totalCredits.length) * 5);
                }
                this.save();
            }

            generatePaymentCode(cardNumber) {
                const card = this.findCard(cardNumber);
                if (!card || card.status !== 'active') {
                    showToast('❌ Карта не активна', 'error');
                    return null;
                }

                const code = Math.random().toString(36).substring(2, 10).toUpperCase();
                const paymentCode = {
                    code,
                    cardNumber,
                    amount: 0,
                    used: false,
                    createdAt: new Date().toISOString(),
                    expiresAt: new Date(Date.now() + 5 * 60 * 1000).toISOString()
                };
                this.paymentCodes.push(paymentCode);
                this.lastPaymentCode = code;
                this.save();
                showToast(`🎲 Код ${code} сгенерирован! Действует 5 минут.`, 'success');
                return code;
            }

            usePaymentCode(code, amount, bizId) {
                const paymentCode = this.paymentCodes.find(p => p.code === code && !p.used);
                if (!paymentCode) {
                    showToast('❌ Код не найден или уже использован', 'error');
                    return { success: false, msg: 'Код не найден или уже использован' };
                }
                
                if (new Date(paymentCode.expiresAt) < new Date()) {
                    showToast('❌ Код истек', 'error');
                    return { success: false, msg: 'Код истек' };
                }

                const card = this.findCard(paymentCode.cardNumber);
                if (!card) {
                    showToast('❌ Карта не найдена', 'error');
                    return { success: false, msg: 'Карта не найдена' };
                }
                if (card.status !== 'active') {
                    showToast('❌ Карта не активна', 'error');
                    return { success: false, msg: 'Карта не активна' };
                }
                if (card.balance < amount) {
                    showToast('❌ Недостаточно средств', 'error');
                    return { success: false, msg: 'Недостаточно средств' };
                }

                const biz = this.businesses.find(b => b.id === bizId);
                if (!biz) {
                    showToast('❌ Бизнес не найден', 'error');
                    return { success: false, msg: 'Бизнес не найден' };
                }

                if (biz.blockedCards?.includes(paymentCode.cardNumber)) {
                    showToast('❌ Карта запрещена для этого магазина', 'error');
                    return { success: false, msg: 'Карта запрещена для этого магазина' };
                }

                card.balance -= amount;
                biz.todayEarn = (biz.todayEarn || 0) + amount;
                
                if (!biz.transactions) biz.transactions = [];
                const transaction = {
                    id: Date.now() + Math.random().toString(36).substring(2, 6),
                    cardNumber: paymentCode.cardNumber,
                    amount: amount,
                    desc: `Оплата по коду ${code}`,
                    date: new Date().toISOString(),
                    refunded: false,
                    code: code
                };
                biz.transactions.push(transaction);
                
                if (!card.transactions) card.transactions = [];
                card.transactions.push({
                    amount: -amount,
                    desc: `Оплата в ${biz.name} (код ${code})`,
                    date: new Date().toISOString()
                });

                paymentCode.used = true;
                paymentCode.amount = amount;
                paymentCode.bizId = bizId;

                this.transactions.push({
                    bizId: bizId,
                    cardNum: paymentCode.cardNumber,
                    amount: amount,
                    desc: `Оплата по коду ${code} в ${biz.name}`,
                    date: new Date().toISOString()
                });

                this.save();
                showToast(`✅ Оплата ${amount}₽ по коду ${code} прошла успешно!`, 'success');
                return { success: true, msg: `Оплата ${amount}₽ по коду ${code}`, cardNumber: paymentCode.cardNumber };
            }

            refundPayment(bizId, index) {
                const biz = this.businesses.find(b => b.id === bizId);
                if (!biz) {
                    showToast('❌ Бизнес не найден', 'error');
                    return { success: false, msg: 'Бизнес не найден' };
                }

                if (!biz.transactions || index >= biz.transactions.length) {
                    showToast('❌ Транзакция не найдена', 'error');
                    return { success: false, msg: 'Транзакция не найдена' };
                }

                const transaction = biz.transactions[index];
                if (!transaction) {
                    showToast('❌ Транзакция не найдена', 'error');
                    return { success: false, msg: 'Транзакция не найдена' };
                }
                if (transaction.refunded) {
                    showToast('⚠️ Возврат уже выполнен', 'error');
                    return { success: false, msg: 'Возврат уже выполнен' };
                }

                const card = this.findCard(transaction.cardNumber);
                if (!card) {
                    showToast('❌ Карта не найдена', 'error');
                    return { success: false, msg: 'Карта не найдена' };
                }

                card.balance += transaction.amount;
                biz.todayEarn = Math.max(0, (biz.todayEarn || 0) - transaction.amount);
                transaction.refunded = true;
                transaction.refundDate = new Date().toISOString();

                if (!card.transactions) card.transactions = [];
                card.transactions.push({
                    amount: transaction.amount,
                    desc: `Возврат от ${biz.name}`,
                    date: new Date().toISOString()
                });

                this.transactions.push({
                    bizId: biz.id,
                    cardNum: transaction.cardNumber,
                    amount: transaction.amount,
                    desc: `Возврат от ${biz.name}`,
                    date: new Date().toISOString(),
                    refund: true
                });

                this.save();
                showToast(`✅ Возврат ${transaction.amount}₽ выполнен на карту ${transaction.cardNumber}`, 'success');
                return { success: true, msg: `Возврат ${transaction.amount}₽ выполнен` };
            }

            setSession(user, business, admin) {
                this.currentUser = user ? user.number : null;
                this.currentBusiness = business ? business.id : null;
                this.isAdmin = admin || false;
                this.save();
            }

            getSession() {
                return {
                    currentUser: this.currentUser,
                    currentBusiness: this.currentBusiness,
                    isAdmin: this.isAdmin
                };
            }

            clearSession() {
                this.currentUser = null;
                this.currentBusiness = null;
                this.isAdmin = false;
                this.save();
            }

            getUserCard() {
                if (!this.currentUser) return null;
                return this.findCard(this.currentUser);
            }

            getBusiness() {
                if (!this.currentBusiness) return null;
                return this.businesses.find(b => b.id === this.currentBusiness);
            }
        }

                            </button>
                        </div>
                    </div>

                    <div class="grid-cards" style="margin-top: 20px;">
                        <div style="background: linear-gradient(135deg, #fef3c7, #fde68a); padding: 16px; border-radius: 16px;">
                            <p style="color: #92400e; font-size: 14px;">💰 Заработано сегодня</p>
                            <p style="font-size: 32px; font-weight: 900; color: #78350f;">${todayEarn} ₽</p>
                        </div>
                        <div style="background: linear-gradient(135deg, #fecaca, #fca5a5); padding: 16px; border-radius: 16px;">
                            <p style="color: #991b1b; font-size: 14px;">🚫 Заблокированные карты</p>
                            <p style="font-size: 32px; font-weight: 900; color: #7f1d1d;">${blockedCount}</p>
                        </div>
                        <div style="background: linear-gradient(135deg, #ddd6fe, #c4b5fd); padding: 16px; border-radius: 16px;">
                            <p style="color: #5b21b6; font-size: 14px;">⭐ Рейтинг</p>
                            <p style="font-size: 32px; font-weight: 900; color: #4c1d95;">${rating.toFixed(1)}</p>
                            <div style="color: #fbbf24; font-size: 20px;">${'★'.repeat(Math.round(rating))}${'☆'.repeat(5 - Math.round(rating))}</div>
                        </div>
                    </div>

                    <div class="grid-cards" style="margin-top: 20px;">
                        <div style="background: var(--section-bg-green); padding: 16px; border-radius: 16px;">
                            <h3 style="font-weight: 700; font-size: 16px; margin-bottom: 12px; color: var(--text-primary);">💳 Оплата по коду</h3>
                            <input id="payCode" placeholder="Код оплаты" class="input-modern" style="margin-bottom: 8px;">
                            <input id="payAmount" type="number" placeholder="Сумма" class="input-modern" style="margin-bottom: 8px;">
                            <button id="payByCodeBtn" class="btn-primary">💸 Оплатить по коду</button>
                            <div id="payMsg" style="margin-top: 8px; font-size: 13px; color: var(--text-secondary);"></div>
                        </div>

                        <div style="background: var(--section-bg-yellow); padding: 16px; border-radius: 16px;">
                            <h3 style="font-weight: 700; font-size: 16px; margin-bottom: 12px; color: var(--text-primary);">🔒 Запретить карту</h3>
                            <input id="blockCardForBiz" placeholder="Номер карты" class="input-modern" style="margin-bottom: 8px;">
                            <button id="blockForBizBtn" style="width: 100%; background: #ef4444; color: white; border: none; padding: 12px; border-radius: 12px; font-weight: 700; cursor: pointer;">🚫 Заблокировать</button>
                            <div id="blockBizMsg" style="margin-top: 8px; font-size: 13px; color: var(--text-secondary);"></div>
                        </div>
                    </div>

                    <div style="margin-top: 24px; border-top: 2px solid var(--border-color); padding-top: 20px;">
                        <h3 style="font-weight: 700; font-size: 18px; margin-bottom: 12px; color: var(--text-primary);">📋 История операций</h3>
                        <div id="bizTransactions" style="max-height: 200px; overflow-y: auto;">
                            ${(biz.transactions || []).slice().reverse().map((t, index) => {
                                const realIndex = (biz.transactions || []).length - 1 - index;
                                return `
                                    <div class="transaction-item" style="${t.refunded ? 'opacity: 0.6; background: #fef2f2;' : ''}">
                                        <span>${t.desc || 'Операция'}</span>
                                        <div style="display: flex; align-items: center; gap: 8px;">
                                            <span style="font-weight: 700; color: ${t.refunded ? '#ef4444' : '#059669'};">${t.refunded ? '↩' : '+'}${t.amount}₽</span>
                                            ${!t.refunded ? `<button onclick="window.handleRefund('${biz.id}', ${realIndex})" style="background: #ef4444; color: white; border: none; padding: 4px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; transition: all 0.2s;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">↩ Возврат</button>` : '<span style="font-size: 12px; color: #ef4444;">✅ Возвращено</span>'}
                                        </div>
                                    </div>
                                `;
                            }).join('') || '<div style="color: var(--text-secondary); text-align: center; padding: 20px;">Нет операций</div>'}
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('payByCodeBtn').onclick = () => {
                const code = document.getElementById('payCode').value.trim().toUpperCase();
                const amt = Number(document.getElementById('payAmount').value);
                
                if (!code) {
                    document.getElementById('payMsg').textContent = '❌ Введите код оплаты';
                    return;
                }
                if (!amt || amt <= 0) {
                    document.getElementById('payMsg').textContent = '❌ Введите корректную сумму';
                    return;
                }
                
                const result = db.usePaymentCode(code, amt, biz.id);
                document.getElementById('payMsg').textContent = result.success ? '✅ ' + result.msg : '❌ ' + result.msg;
                if (result.success) {
                    const updatedBiz = db.businesses.find(b => b.id === biz.id);
                    if (updatedBiz) {
                        renderBusiness(updatedBiz);
                    }
                }
            };

            document.getElementById('blockForBizBtn').onclick = () => {
                const num = document.getElementById('blockCardForBiz').value.trim();
                if (!num) {
                    document.getElementById('blockBizMsg').textContent = '❌ Введите номер карты';
                    return;
                }
                if (!biz.blockedCards) biz.blockedCards = [];
                if (!biz.blockedCards.includes(num)) {
                    biz.blockedCards.push(num);
                    db.save();
                    document.getElementById('blockBizMsg').textContent = '🚫 Карта запрещена';
                    renderBusiness(biz);
                } else {
                    document.getElementById('blockBizMsg').textContent = '⚠️ Карта уже в списке';
                }
            };
        }

        window.handleRefund = (bizId, index) => {
            const db = window.KOKA.db;
            const result = db.refundPayment(bizId, index);
            if (result.success) {
                const updatedBiz = db.businesses.find(b => b.id === bizId);
                if (updatedBiz) {
                    renderBusiness(updatedBiz);
                }
            }
        };

        // ============================================
        // USER - Панель пользователя
        // ============================================
        function renderUser(card) {
            const db = window.KOKA.db;
            const rating = card.creditRating || 0;
            const fullStars = Math.round(rating);
            const emptyStars = 5 - fullStars;
            const lastCode = db.lastPaymentCode || 'Нет кода';
            const theme = getTheme();

            app.innerHTML = `
                <div class="glass-card slide-up">
                    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border-color); padding-bottom: 16px; flex-wrap: wrap; gap: 10px;">
                        <div>
                            <h2 style="font-size: 28px; font-weight: 900; color: var(--text-primary);">👋 ${card.owner}</h2>
                            <p style="color: var(--text-secondary); font-size: 14px;">Клиент с ${new Date(card.createdAt).toLocaleDateString()}</p>
                        </div>
                        <div style="display: flex; gap: 8px; align-items: center;">
                            <button onclick="toggleTheme()" style="background: var(--transaction-bg); padding: 8px 16px; border-radius: 12px; border: 1px solid var(--border-color); cursor: pointer; font-size: 16px; color: var(--text-primary);">
                                ${theme === 'dark' ? '☀️' : '🌙'}
                            </button>
                            <button onclick="navigateToLogin()" style="background: var(--transaction-bg); padding: 8px 20px; border-radius: 12px; border: 1px solid var(--border-color); font-weight: 600; cursor: pointer; transition: all 0.2s; color: var(--text-primary);">
                                Выйти
                            </button>
                        </div>
                    </div>

                    <div class="grid-cards" style="margin-top: 20px;">
                        <div style="background: linear-gradient(135deg, #dbeafe, #bfdbfe); padding: 16px; border-radius: 16px;">
                            <p style="color: #1e40af; font-size: 14px;">💳 Карта</p>
                            <p class="card-number" style="font-size: 16px; font-weight: 700; color: #1e3a8a;">${card.number}</p>
                        </div>
                        <div style="background: linear-gradient(135deg, #d1fae5, #a7f3d0); padding: 16px; border-radius: 16px;">
                            <p style="color: #065f46; font-size: 14px;">💰 Баланс</p>
                            <p style="font-size: 36px; font-weight: 900; color: #064e3b;">${card.balance} ₽</p>
                        </div>
                        <div style="background: linear-gradient(135deg, #ede9fe, #c4b5fd); padding: 16px; border-radius: 16px;">
                            <p style="color: #4c1d95; font-size: 14px;">🏦 Кредитный лимит</p>
                            <p style="font-size: 24px; font-weight: 900; color: #4c1d95;">${card.creditLimit || 0} ₽</p>
                            <p style="color: #6d28d9; font-size: 14px;">Использовано: ${card.creditUsed || 0} ₽</p>
                        </div>
                        <div style="background: linear-gradient(135deg, #fef3c7, #fde68a); padding: 16px; border-radius: 16px;">
                            <p style="color: #78350f; font-size: 14px;">⭐ Рейтинг</p>
                            <p style="font-size: 28px; font-weight: 900; color: #78350f;">${rating.toFixed(1)}</p>
                            <div style="color: #fbbf24; font-size: 20px;">${'★'.repeat(fullStars)}${'☆'.repeat(emptyStars)}</div>
                        </div>
                    </div>

                    <div class="grid-cards" style="margin-top: 20px;">
                        <div style="background: var(--section-bg-green); padding: 16px; border-radius: 16px;">
                            <h3 style="font-weight: 700; font-size: 16px; margin-bottom: 12px; color: var(--text-primary);">💳 Погасить кредит</h3>
                            <input id="repayAmount" type="number" placeholder="Сумма" class="input-modern" style="margin-bottom: 8px;">
                            <button id="repayBtn" style="width: 100%; background: #10b981; color: white; border: none; padding: 12px; border-radius: 12px; font-weight: 700; cursor: pointer;">💰 Погасить</button>
                            <div id="repayMsg" style="margin-top: 8px; font-size: 13px; color: var(--text-secondary);"></div>
                        </div>

                        <div style="background: var(--section-bg-purple); padding: 16px; border-radius: 16px;">
                            <h3 style="font-weight: 700; font-size: 16px; margin-bottom: 12px; color: var(--text-primary);">🔐 Анонимный код</h3>
                            <button id="generateCodeBtn" style="width: 100%; background: linear-gradient(135deg, #8b5cf6, #7c3aed); color: white; border: none; padding: 12px; border-radius: 12px; font-weight: 700; cursor: pointer;">🎲 Сгенерировать код</button>
                            <div id="codeDisplay" style="margin-top: 8px;">
                                <p style="font-size: 12px; color: var(--text-secondary);">Последний код:</p>
                                <div class="payment-code" id="paymentCodeDisplay" onclick="copyPaymentCode()">${lastCode}</div>
                                <p style="font-size: 11px; color: var(--text-secondary);">Код действует 5 минут, одноразовый</p>
                            </div>
                            <div id="codeMsg" style="margin-top: 8px; font-size: 13px; color: var(--text-secondary);"></div>
                        </div>
                    </div>

                    <div style="margin-top: 24px; border-top: 2px solid var(--border-color); padding-top: 20px;">
                        <h3 style="font-weight: 700; font-size: 18px; margin-bottom: 12px; color: var(--text-primary);">📋 История транзакций</h3>
                        <div id="userTransactions" style="max-height: 200px; overflow-y: auto;">
                            ${card.transactions?.slice().reverse().map(t => `
                                <div class="transaction-item">
                                    <span>${t.desc}</span>
                                    <span style="font-weight: 700; ${t.amount < 0 ? 'color: #ef4444;' : 'color: #10b981;'}">${t.amount > 0 ? '+' : ''}${t.amount}₽</span>
                                </div>
                            `).join('') || '<div style="color: var(--text-secondary); text-align: center; padding: 20px;">Нет транзакций</div>'}
                        </div>
                    </div>

                    <div style="margin-top: 16px; color: var(--text-secondary); font-size: 12px; text-align: center;">
                        💳 Ежедневное обслуживание: 35₽
                    </div>
                </div>
            `;

            document.getElementById('repayBtn').onclick = () => {
                const amt = Number(document.getElementById('repayAmount').value);
                const result = db.repayCredit(card.number, amt);
                document.getElementById('repayMsg').textContent = result.success ? '✅ ' + result.msg : '❌ ' + result.msg;
                if (result.success) renderUser(card);
            };

            document.getElementById('generateCodeBtn').onclick = () => {
                const code = db.generatePaymentCode(card.number);
                if (code) {
                    document.getElementById('paymentCodeDisplay').textContent = code;
                    document.getElementById('paymentCodeDisplay').className = 'payment-code';
                    document.getElementById('codeMsg').textContent = '✅ Код сгенерирован! Действует 5 минут';
                    navigator.clipboard.writeText(code).then(() => {
                        document.getElementById('paymentCodeDisplay').classList.add('copied');
                        document.getElementById('paymentCodeDisplay').textContent = '✅ Скопировано!';
                        setTimeout(() => {
                            document.getElementById('paymentCodeDisplay').textContent = code;
                            document.getElementById('paymentCodeDisplay').classList.remove('copied');
                        }, 2000);
                    }).catch(() => {});
                } else {
                    document.getElementById('codeMsg').textContent = '❌ Ошибка генерации кода';
                }
            };
        }

        window.copyPaymentCode = () => {
            const el = document.getElementById('paymentCodeDisplay');
            const code = el.textContent;
            if (code && code !== 'Нет кода' && !code.includes('Скопировано')) {
                navigator.clipboard.writeText(code).then(() => {
                    el.classList.add('copied');
                    el.textContent = '✅ Скопировано!';
                    setTimeout(() => {
                        el.textContent = code;
                        el.classList.remove('copied');
                    }, 2000);
                }).catch(() => {
                    const range = document.createRange();
                    range.selectNode(el);
                    window.getSelection().removeAllRanges();
                    window.getSelection().addRange(range);
                    document.execCommand('copy');
                    el.classList.add('copied');
                    el.textContent = '✅ Скопировано!';
                    setTimeout(() => {
                        el.textContent = code;
                        el.classList.remove('copied');
                    }, 2000);
                });
            }
        };

        // ============================================
        // ЗАПУСК
        // ============================================
        
        const db = new DB();
        if (db.cards.length === 0) {
            const testCard = {
                number: 'KOKA-TEST-001',
                balance: 1000,
                blocked: false,
                status: 'active',
                owner: 'Тестовый пользователь',
                transactions: [],
                lastTaxDate: '',
                creditLimit: 5000,
                creditUsed: 0,
                creditRating: 4.5,
                createdAt: new Date().toISOString()
            };
            db.cards.push(testCard);
            db.save();
            showToast('✅ Тестовая карта KOKA-TEST-001 создана!', 'success');
        }

        if (!restoreSession()) {
            renderLogin();
        }

        setInterval(() => {
            const today = new Date().toDateString();
            const db = window.KOKA.db;
            db.cards.forEach(c => {
                if (c.status === 'active' && c.lastTaxDate !== today) {
                    c.balance = Math.max(0, c.balance - 35);
                    c.lastTaxDate = today;
                    c.transactions.push({
                        amount: -35,
                        desc: 'Обслуживание карты',
                        date: new Date().toISOString()
                    });
                }
            });
            db.save();
        }, 60000);

        setInterval(() => {
            const db = window.KOKA.db;
            const now = new Date();
            db.paymentCodes = db.paymentCodes.filter(p => new Date(p.expiresAt) > now || p.used);
            db.save();
        }, 30000);
    </script>
</body>
</html>
